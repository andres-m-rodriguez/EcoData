# Deploy to Azure using Aspire pipelines
name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Git ref to diff against when picking affected services (default: previous commit)"
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

# All runs deploy into the same resource group; overlapping runs race on ARM
# updates to shared resources (e.g. Log Analytics "Workspace cannot be updated
# while current provisioning state is not Succeeded"), so queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for dotnet-affected

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install Tools
        run: |
          dotnet tool install -g aspire.cli --prerelease
          dotnet tool install -g dotnet-affected

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Deploy Mappings
        run: dotnet run scripts/generate-deploy-mappings.cs

      - name: Deploy Affected Services
        env:
          Azure__SubscriptionId: ${{ env.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ env.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          Parameters__jwt-user-secret-key: ${{ secrets.JWT_USER_SECRET_KEY }}
          Parameters__jwt-sensor-secret-key: ${{ secrets.JWT_SENSOR_SECRET_KEY }}
          Parameters__customDomain: ${{ vars.CUSTOM_DOMAIN }}
          Parameters__certificateName: ${{ vars.CERTIFICATE_NAME }}
          # Empty on a manual dispatch, where there is no previous-push ref.
          DEPLOY_FROM: ${{ inputs.from || github.event.before }}
          DEPLOY_TO: ${{ github.sha }}
        run: |
          dotnet run scripts/deploy-affected.cs -- \
            --from "${DEPLOY_FROM:-HEAD~1}" \
            --to "$DEPLOY_TO"

      # Housekeeping, not shipping: every deploy pushes new image tags and
      # nothing ever removed the old ones, so the Basic-SKU registry was
      # creeping towards its included 10 GiB (past that Azure bills per GiB).
      # Runs only after a successful deploy of master, and never fails the run.
      - name: Purge Stale Container Images
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          set -euo pipefail

          registry=$(az acr list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[0].name" -o tsv)

          if [ -z "$registry" ]; then
            echo "No container registry in $AZURE_RESOURCE_GROUP; nothing to purge."
            exit 0
          fi

          # Every repository, discovered rather than hard-coded, so repositories
          # added by a future service are cleaned up without touching this file.
          filters=""
          for repo in $(az acr repository list --name "$registry" -o tsv); do
            filters="$filters --filter '$repo:.*'"
          done

          if [ -z "$filters" ]; then
            echo "Registry $registry has no repositories; nothing to purge."
            exit 0
          fi

          echo "Purging $registry:$filters"

          # --ago 0d with --keep 10 means "every tag except the 10 most recent",
          # which is the rollback window.
          az acr run --registry "$registry" --timeout 3600 \
            --cmd "acr purge $filters --ago 0d --keep 10" /dev/null

          # Manifests orphaned when a tag moved to a newer digest. The 7-day
          # floor leaves digests a recently deployed revision may still pin.
          az acr run --registry "$registry" --timeout 3600 \
            --cmd "acr purge $filters --ago 7d --untagged" /dev/null
